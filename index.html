<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pascal Dependency Viewer</title>
  </head>
  <body>
    <div id="rootUnitSelection" style="display: none;">
      <input type="text" id="rootUnitFilter" placeholder="Filtrar por nome da unit" />
      <div id="usesScopeControl">
        <label>
          <input type="radio" name="usesScope" value="interface" checked />
          Interface
        </label>
        <label>
          <input type="radio" name="usesScope" value="interfaceAndImplementation" />
          Interface + Implementation
        </label>
      </div>
      <ul id="rootUnitList"></ul>
    </div>

    <div id="mynetwork"></div>

    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
