<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pascal Dependency Viewer</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #mynetwork,
      #rootUnitSelection {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
      }

      #viewFilterPanel {
        display: none;
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        background: white;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 8px 12px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        font-family: sans-serif;
        font-size: 14px;
      }

      #viewFilterPanel p {
        margin: 0 0 6px;
        font-weight: bold;
      }

      #viewFilterPanel label {
        display: block;
      }

      #openRecentOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.3);
        font-family: sans-serif;
        font-size: 14px;
      }

      #openRecentDialog {
        width: 560px;
        max-width: calc(100% - 32px);
        margin: 48px auto 0;
        background: white;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      #openRecentInputRow {
        display: flex;
        align-items: center;
        padding: 8px 12px;
        border-bottom: 1px solid #ddd;
      }

      #openRecentPrefix {
        flex: none;
        margin-right: 8px;
        padding: 2px 8px;
        background: #e8e8e8;
        border-radius: 3px;
        color: #333;
        user-select: none;
      }

      #openRecentInput {
        flex: 1;
        min-width: 0;
        border: none;
        outline: none;
        font: inherit;
      }

      #openRecentList {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 320px;
        overflow-y: auto;
      }

      #openRecentList li {
        padding: 6px 12px;
        cursor: pointer;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #openRecentList li.selected {
        background: #d6e9ff;
      }

      #openRecentList .recentDir {
        display: block;
        color: #666;
        font-size: 12px;
      }

      #openRecentEmpty {
        display: none;
        padding: 12px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="rootUnitSelection" style="display: none;">
      <input type="text" id="rootUnitFilter" placeholder="Filtrar por nome da unit" />
      <ul id="rootUnitList"></ul>
    </div>

    <div id="mynetwork"></div>

    <div id="viewFilterPanel">
      <p>View Filter</p>
      <label>
        <input type="checkbox" id="viewFilterInterface" checked />
        Interface
      </label>
      <label>
        <input type="checkbox" id="viewFilterImplementation" checked />
        Implementação
      </label>
      <label>
        <input type="checkbox" id="viewFilterExternal" />
        Unidades Externas
      </label>
    </div>

    <div id="openRecentOverlay">
      <div id="openRecentDialog">
        <div id="openRecentInputRow">
          <span id="openRecentPrefix">Abrir recente</span>
          <input type="text" id="openRecentInput" autocomplete="off" />
        </div>
        <ul id="openRecentList"></ul>
        <div id="openRecentEmpty">Nenhum projeto recente</div>
      </div>
    </div>

    <script type="module" src="/src/renderer/index.js"></script>
  </body>
</html>
