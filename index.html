<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pascal Dependency Viewer</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      /* Sem altura resolvível aqui, o canvas da vis-network dimensiona o
         container e o container dimensiona o canvas, crescendo sem parar. */
      #app {
        flex: 1;
        min-height: 0;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="commandPaletteContainer"></div>

    <script type="module" src="/src/renderer/index.js"></script>
  </body>
</html>
